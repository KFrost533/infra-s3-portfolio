<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio</title>
  <style>
    body { font-family: system-ui, sans-serif; line-height: 1.6; margin: 0; background: #f4f6fa; color: #172033; }
    main { max-width: 70rem; margin: 0 auto; padding: 2rem 1rem; }
    .languages { display: grid; grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); gap: 1rem; }
    section { background: white; border-radius: .75rem; padding: 1.25rem; box-shadow: 0 2px 10px #0001; }
    h1, h2 { line-height: 1.2; }
    ul { padding-left: 1.25rem; overflow-wrap: anywhere; }
    a { color: #174ea6; }
    a:focus-visible { outline: 3px solid #174ea6; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>Portfolio</h1>
    <p>Choose a portfolio page below.</p>
    <div class="languages">
      <section lang="ja" aria-labelledby="japanese-heading">
        <h2 id="japanese-heading">Japanese (JP)</h2>
        <!-- PORTFOLIO_JP_LINKS -->
      </section>
      <section lang="en" aria-labelledby="english-heading">
        <h2 id="english-heading">English (EN)</h2>
        <!-- PORTFOLIO_EN_LINKS -->
      </section>
    </div>
  </main>
</body>
</html>
