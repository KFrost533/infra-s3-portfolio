name: Auto Apply portfolio infrastructure

on:
  schedule:
    # JST 09:00 AM
    - cron: "00 0 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: portfolio-infrastructure
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/main
        shell: bash
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      PORTFOLIO_BUCKET: ${{ secrets.PORTFOLIO_BUCKET }}
      TF_VAR_bucket_name: ${{ secrets.PORTFOLIO_BUCKET }}
      HOSTED_ZONE_ID: ${{ secrets.HOSTED_ZONE_ID }}
      TF_APPLY_ROLE_ARN: ${{ secrets.TF_APPLY_ROLE_ARN }}
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      TF_STATE_KEY: portfolio/terraform.tfstate
      TF_STATE_REGION: "ap-southeast-2"
      TF_IN_AUTOMATION: "true"
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Prepare Terraform inputs
        run: |
          set -euo pipefail
          for name in AWS_REGION AWS_ACCOUNT_ID PORTFOLIO_BUCKET HOSTED_ZONE_ID TF_APPLY_ROLE_ARN TF_STATE_BUCKET TF_STATE_KEY TF_STATE_REGION; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required GitHub Actions variable or secret: $name" >&2
              exit 1
            fi
          done
          if [[ "$TF_STATE_BUCKET" == "$PORTFOLIO_BUCKET" ]]; then
            echo "The state bucket must be separate from the portfolio bucket." >&2
            exit 1
          fi
          umask 077
          mkdir -p ../creds
          jq -n --arg id "$HOSTED_ZONE_ID" \
            '{hosted_zone_id: $id}' > ../creds/main.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          role-to-assume: ${{ secrets.TF_APPLY_ROLE_ARN }}
          role-session-name: portfolio-terraform-apply
          mask-aws-account-id: true

      - name: Verify AWS account
        run: |
          set -euo pipefail
          actual_account=$(aws sts get-caller-identity --query Account --output text)
          if [[ "$actual_account" != "$AWS_ACCOUNT_ID" ]]; then
            echo "Authenticated to an unexpected AWS account." >&2
            exit 1
          fi

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false

      - name: Initialize remote state
        run: |
          set -euo pipefail
          aws s3api head-bucket --bucket "$TF_STATE_BUCKET" \
            --region "$TF_STATE_REGION" --no-cli-pager
          terraform init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=$TF_STATE_KEY" \
            -backend-config="region=$TF_STATE_REGION"

      - name: Plan infrastructure changes
        run: terraform plan -input=false -lock-timeout=5m -out="$RUNNER_TEMP/apply.tfplan"

      - name: Reject destructive changes
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/apply-plan.json"
          terraform show -json "$RUNNER_TEMP/apply.tfplan" > "$plan"
          if ! jq -e '
            all(.resource_changes[]?;
              (.change.actions | index("delete")) == null)
          ' "$plan" >/dev/null; then
            echo "The plan contains a deletion or replacement; automatic apply is blocked." >&2
            exit 1
          fi
          if ! jq -e --arg bucket "$PORTFOLIO_BUCKET" '
            [.planned_values.root_module.child_modules[]? |
              select(.address == "module.s3") |
              .resources[]? |
              select(.address == "module.s3.data.aws_s3_bucket.portfolio" and .mode == "data")] |
            length == 1 and
            all(.[]; .values.bucket == $bucket)
          ' "$plan" >/dev/null; then
            echo "The planned portfolio bucket does not match PORTFOLIO_BUCKET." >&2
            exit 1
          fi

      - name: Apply reviewed plan
        run: terraform apply -input=false -lock-timeout=5m "$RUNNER_TEMP/apply.tfplan"
