name: Auto Apply portfolio infrastructure

on:
  schedule:
    # JST 12:00 AM
    - cron: "00 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: portfolio-infrastructure
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/main
        shell: bash
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      PORTFOLIO_BUCKET: ${{ vars.PORTFOLIO_BUCKET }}
      TF_APPLY_ROLE_ARN: ${{ vars.TF_APPLY_ROLE_ARN }}
      TF_HOSTED_ZONE_ID: ${{ vars.TF_HOSTED_ZONE_ID }}
      TF_STATE_BUCKET: "tf-kfrost533"
      TF_STATE_KEY: portfolio/terraform.tfstate
      TF_STATE_REGION: "ap-southeast-2"
      TF_IN_AUTOMATION: "true"
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Check configuration
        env:
          TF_VARS_JSON: ${{ secrets.TF_VARS_JSON }}
        run: |
          set -euo pipefail
          for name in AWS_REGION AWS_ACCOUNT_ID PORTFOLIO_BUCKET TF_APPLY_ROLE_ARN TF_HOSTED_ZONE_ID TF_STATE_BUCKET TF_STATE_KEY TF_STATE_REGION TF_VARS_JSON; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required GitHub Actions variable or secret: $name" >&2
              exit 1
            fi
          done
          if [[ "$TF_STATE_BUCKET" == "$PORTFOLIO_BUCKET" ]]; then
            echo "The state bucket must be separate from the portfolio bucket." >&2
            exit 1
          fi
          umask 077
          printf '%s' "$TF_VARS_JSON" | jq -e 'type == "object"' >/dev/null
          printf '%s' "$TF_VARS_JSON" > terraform.tfvars.json
          mkdir -p ../creds
          jq -n --arg id "$AWS_ACCOUNT_ID" --arg zone "$TF_HOSTED_ZONE_ID" \
            '{account_id: $id, hosted_zone_id: $zone}' > ../creds/main.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.TF_APPLY_ROLE_ARN }}
          role-session-name: portfolio-terraform-apply

      - name: Verify AWS account
        run: |
          set -euo pipefail
          actual_account=$(aws sts get-caller-identity --query Account --output text)
          if [[ "$actual_account" != "$AWS_ACCOUNT_ID" ]]; then
            echo "Authenticated to unexpected AWS account: $actual_account" >&2
            exit 1
          fi

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false

      - name: Initialize remote state
        run: |
          set -euo pipefail
          aws s3api head-bucket --bucket "$TF_STATE_BUCKET" \
            --region "$TF_STATE_REGION" --no-cli-pager
          terraform init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=$TF_STATE_KEY" \
            -backend-config="region=$TF_STATE_REGION"

      - name: Plan infrastructure changes
        run: terraform plan -input=false -lock-timeout=5m -out="$RUNNER_TEMP/apply.tfplan"

      - name: Reject destructive changes
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/apply-plan.json"
          terraform show -json "$RUNNER_TEMP/apply.tfplan" > "$plan"
          if ! jq -e '
            all(.resource_changes[]?;
              (.change.actions | index("delete")) == null)
          ' "$plan" >/dev/null; then
            echo "The plan contains a deletion or replacement; automatic apply is blocked." >&2
            exit 1
          fi
          if ! jq -e --arg bucket "$PORTFOLIO_BUCKET" '
            all([.resource_changes[]? |
              select(.address == "module.s3.aws_s3_bucket.portfolio")];
              (.change.after.bucket // .change.before.bucket) == $bucket)
          ' "$plan" >/dev/null; then
            echo "The planned portfolio bucket does not match PORTFOLIO_BUCKET." >&2
            exit 1
          fi

      - name: Apply reviewed plan
        run: terraform apply -input=false -lock-timeout=5m "$RUNNER_TEMP/apply.tfplan"
