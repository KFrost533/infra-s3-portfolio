name: Auto Destroy portfolio infrastructure

on:
  schedule:
    # JST 19:00
    - cron: "0 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: portfolio-infrastructure
  cancel-in-progress: false

jobs:
  destroy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/main
        shell: bash
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      PORTFOLIO_BUCKET: ${{ secrets.PORTFOLIO_BUCKET }}
      TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
      TF_VAR_bucket_name: ${{ secrets.PORTFOLIO_BUCKET }}
      HOSTED_ZONE_ID: ${{ secrets.HOSTED_ZONE_ID }}
      TF_DESTROY_ROLE_ARN: ${{ secrets.TF_DESTROY_ROLE_ARN }}
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      TF_STATE_KEY: portfolio/terraform.tfstate
      TF_STATE_REGION: "ap-southeast-2"
      TF_IN_AUTOMATION: "true"
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Prepare Terraform inputs
        run: |
          set -euo pipefail
          for name in AWS_REGION AWS_ACCOUNT_ID TF_DESTROY_ROLE_ARN TF_STATE_BUCKET TF_STATE_KEY TF_STATE_REGION PORTFOLIO_BUCKET HOSTED_ZONE_ID; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required GitHub Actions variable or secret: $name" >&2
              exit 1
            fi
          done
          if [[ "$TF_STATE_BUCKET" == "$PORTFOLIO_BUCKET" ]]; then
            echo "The state bucket must be separate from the portfolio bucket." >&2
            exit 1
          fi
          umask 077
          mkdir -p ../creds
          jq -n --arg id "$HOSTED_ZONE_ID" \
            '{hosted_zone_id: $id}' > ../creds/main.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          role-to-assume: ${{ secrets.TF_DESTROY_ROLE_ARN }}
          role-session-name: portfolio-destroy
          mask-aws-account-id: true

      - name: Verify AWS account
        run: |
          set -euo pipefail
          actual_account=$(aws sts get-caller-identity --query Account --output text)
          if [[ "$actual_account" != "$AWS_ACCOUNT_ID" ]]; then
            echo "Authenticated to an unexpected AWS account." >&2
            exit 1
          fi

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false

      - name: Initialize existing remote state
        run: |
          set -euo pipefail
          aws s3api head-object --bucket "$TF_STATE_BUCKET" --key "$TF_STATE_KEY" \
            --region "$TF_STATE_REGION" --no-cli-pager >/dev/null
          terraform init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=$TF_STATE_KEY" \
            -backend-config="region=$TF_STATE_REGION"

      - name: Plan destruction
        run: terraform plan -destroy -input=false -lock-timeout=5m -out="$RUNNER_TEMP/destroy.tfplan"

      - name: Reject protected resource deletion
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/destroy-plan.json"
          terraform show -json "$RUNNER_TEMP/destroy.tfplan" > "$plan"
          if ! jq -e --arg state_bucket "$TF_STATE_BUCKET" '
            all(.resource_changes[]?;
              ((.change.actions | index("delete")) == null) or
              ((.type != "aws_s3_bucket" or .change.before.bucket != $state_bucket) and
               (.type != "aws_iam_openid_connect_provider" or
                .change.before.url != "https://token.actions.githubusercontent.com")))
          ' "$plan" >/dev/null; then
            echo "The plan would delete the state bucket or GitHub OIDC provider." >&2
            exit 1
          fi
          if ! jq -e --arg bucket "$PORTFOLIO_BUCKET" '
            all(.resource_changes[]?;
              ((.change.actions | index("delete")) == null) or
              (.address != "module.s3.aws_s3_bucket.portfolio" and
               (.type != "aws_s3_bucket" or .change.before.bucket != $bucket)))
          ' "$plan" >/dev/null; then
            echo "The plan would delete the protected portfolio bucket." >&2
            exit 1
          fi

      - name: Apply destruction plan
        run: terraform apply -input=false -lock-timeout=5m "$RUNNER_TEMP/destroy.tfplan"