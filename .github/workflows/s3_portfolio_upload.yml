name: Deploy portfolio HTML files to S3

on:
  push:
    branches: [main]
    paths:
      - "portfolio/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-s3-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the selected commit
        uses: actions/checkout@v4

      - name: Find and validate portfolio HTML files
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          PORTFOLIO_BUCKET: ${{ vars.PORTFOLIO_BUCKET }}
          MANIFEST_PATH: ${{ runner.temp }}/portfolio-html-paths
          MAIN_PAGE_PATH: ${{ runner.temp }}/portfolio-main.html
        run: |
          python3 - <<'PY'
          import os
          import html
          import pathlib
          import subprocess
          import sys
          from urllib.parse import quote

          required = ("AWS_REGION", "AWS_ROLE_ARN", "PORTFOLIO_BUCKET")
          if not all(os.environ[name].strip() for name in required):
              sys.exit("Configure the AWS_REGION, AWS_ROLE_ARN and PORTFOLIO_BUCKET repository variables.")
          workspace = pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          
          tracked = subprocess.run(
              ["git", "ls-files", "-z", "--", "portfolio/jp", "portfolio/en"],
              cwd=workspace,
              stdout=subprocess.PIPE,
              check=True,
          ).stdout.split(b"\0")
          files = [os.fsdecode(path) for path in tracked if path.endswith(b".html")]

          if not files:
              sys.exit("Commit at least one HTML file under portfolio/jp or portfolio/en.")
          counts = {"jp": 0, "en": 0}

          for name in files:
              relative = pathlib.Path(name)
              if len(relative.parts) < 3 or relative.parts[0] != "portfolio" or relative.parts[1] not in counts:
                  sys.exit("A selected file is outside the portfolio language directories.")
              language = relative.parts[1]
              base = (workspace / "portfolio" / language).resolve()
              source = workspace / relative
              selected = source.resolve()
              if not base.is_relative_to(workspace) or not selected.is_relative_to(base) or source.is_symlink() or not selected.is_file():
                  sys.exit("Each HTML file must be a regular file inside its portfolio language directory.")
              if selected.stat().st_size > 10 * 1024 * 1024:
                  sys.exit("Portfolio HTML files must not exceed 10 MiB each.")
              counts[language] += 1

          for language, count in counts.items():
              if not count:
                  print(f"No committed HTML files found for {language}; no files will be uploaded for that language.")
          template_path = workspace / "portfolio" / "main.html"

          if template_path.is_symlink() or not template_path.is_file():
              sys.exit("The portfolio main page template is missing or is not a regular file.")
          template = template_path.read_text(encoding="utf-8")

          for language in ("jp", "en"):
              marker = f"<!-- PORTFOLIO_{language.upper()}_LINKS -->"
              if template.count(marker) != 1:
                  sys.exit(f"The main page must contain exactly one {marker} marker.")
              names = sorted(name for name in files if pathlib.PurePosixPath(name).parts[1] == language)
              links = [
                  f'<li><a href="/{html.escape(quote(name, safe="/"), quote=True)}">'
                  f'{html.escape("/".join(pathlib.PurePosixPath(name).parts[2:]))}</a></li>'
                  for name in names
              ]
              content = "<ul>\n" + "\n".join(links) + "\n</ul>" if links else "<p>No portfolio pages available.</p>"
              template = template.replace(marker, content)
          pathlib.Path(os.environ["MAIN_PAGE_PATH"]).write_text(template, encoding="utf-8")
          pathlib.Path(os.environ["MANIFEST_PATH"]).write_bytes(b"".join(os.fsencode(name) + b"\0" for name in files))
          print(f"Validated {len(files)} HTML file(s).")
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Find the portfolio CloudFront distribution
        id: distribution
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          PORTFOLIO_BUCKET: ${{ vars.PORTFOLIO_BUCKET }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys

          def aws_json(*args):
              try:
                  result = subprocess.run(
                      ["aws", "cloudfront", *args, "--output", "json", "--no-cli-pager"],
                      check=True, stdout=subprocess.PIPE, text=True,
                  )
              except subprocess.CalledProcessError:
                  sys.exit(f"CloudFront {args[0]} failed; see the AWS error above.")
              return json.loads(result.stdout)

          response = aws_json("list-distributions")
          matches = []

          for distribution in response["DistributionList"].get("Items", []):
              tags = aws_json("list-tags-for-resource", "--resource", distribution["ARN"])
              if any(tag["Key"] == "Project" and tag["Value"] == "portfolio" for tag in tags["Tags"].get("Items", [])):
                  matches.append(distribution)

              if len(matches) != 1:
                sys.exit(f"Expected exactly one CloudFront distribution tagged Project=portfolio; found {len(matches)}.")
              distribution_id = matches[0]["Id"]

          if not re.fullmatch(r"[A-Z0-9]{1,32}", distribution_id):
            sys.exit("The discovered CloudFront distribution ID is invalid.")

          distribution = aws_json("get-distribution", "--id", distribution_id)["Distribution"]
          expected_origin = f'{os.environ["PORTFOLIO_BUCKET"]}.s3.{os.environ["AWS_REGION"]}.amazonaws.com'
          origins = distribution["DistributionConfig"]["Origins"]["Items"]

          if not any(origin["DomainName"] == expected_origin for origin in origins):
              sys.exit("The matched CloudFront distribution does not use the configured portfolio bucket as an origin.")

            with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"distribution_id={distribution_id}\n")

              print("Found one authorised portfolio distribution with the configured S3 origin.")

          PY

      - name: Upload portfolio HTML to S3
        env:
          BUCKET: ${{ vars.PORTFOLIO_BUCKET }}
          MANIFEST_PATH: ${{ runner.temp }}/portfolio-html-paths
          MAIN_PAGE_PATH: ${{ runner.temp }}/portfolio-main.html
        run: |
          while IFS= read -r -d '' file; do
            aws s3api put-object \
              --bucket "$BUCKET" \
              --key "$file" \
              --body "$file" \
              --content-type "text/html; charset=utf-8" \
              --cache-control "no-cache, no-store, must-revalidate" \
              --no-cli-pager
          done < "$MANIFEST_PATH"
          aws s3api put-object \
            --bucket "$BUCKET" \
            --key "portfolio/main.html" \
            --body "$MAIN_PAGE_PATH" \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --no-cli-pager

      - name: Invalidate CloudFront cache
        env:
          DISTRIBUTION_ID: ${{ steps.distribution.outputs.distribution_id }}
        run: |
          invalidation_id=$(aws cloudfront create-invalidation \
              --distribution-id "$DISTRIBUTION_ID" \
              --paths '/*' \
              --query 'Invalidation.Id' \
              --output text \
              --no-cli-pager)
          aws cloudfront wait invalidation-completed \
              --distribution-id "$DISTRIBUTION_ID" \
              --id "$invalidation_id" \
              --no-cli-pager
