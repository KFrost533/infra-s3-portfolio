name: Deploy portfolio HTML files to S3

on:
  schedule:
    # JST 09:00 AM
    - cron: "20 00 * * 1-5"
  push:
    branches: [main]
    paths:
      - "portfolio/**"
      - ".github/workflows/s3_portfolio_upload.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-infrastructure
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the selected commit
        uses: actions/checkout@v4

      - name: Build standalone portfolio pages
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ROLE_ARN: ${{ vars.DEPLOY_ROLE_ARN }}
          PORTFOLIO_BUCKET: ${{ vars.PORTFOLIO_BUCKET }}
          SITE_DIRECTORY: ${{ runner.temp }}/portfolio-site
          MANIFEST_PATH: ${{ runner.temp }}/portfolio-site-manifest
        run: |
          if [[ -z "$AWS_REGION" || -z "$AWS_ROLE_ARN" || -z "$PORTFOLIO_BUCKET" ]]; then
            echo "Configure the AWS_REGION, AWS_ROLE_ARN and PORTFOLIO_BUCKET repository variables." >&2
            exit 1
          fi
          python3 scripts/build_portfolio.py \
            --output "$SITE_DIRECTORY" \
            --manifest "$MANIFEST_PATH"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}          

      - name: Find the portfolio CloudFront distribution
        id: distribution
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          PORTFOLIO_BUCKET: ${{ vars.PORTFOLIO_BUCKET }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys

          def aws_json(*args):
              try:
                  result = subprocess.run(
                      ["aws", "cloudfront", *args, "--output", "json", "--no-cli-pager"],
                      check=True, stdout=subprocess.PIPE, text=True,
                  )
              except subprocess.CalledProcessError:
                  sys.exit(f"CloudFront {args[0]} failed; see the AWS error above.")
              return json.loads(result.stdout)

          response = aws_json("list-distributions")
          matches = []

          for distribution in response["DistributionList"].get("Items", []):
              tags = aws_json("list-tags-for-resource", "--resource", distribution["ARN"])
              if any(tag["Key"] == "Project" and tag["Value"] == "portfolio" for tag in tags["Tags"].get("Items", [])):
                  matches.append(distribution)

          if len(matches) != 1:
              sys.exit(f"Expected exactly one CloudFront distribution tagged Project=portfolio; found {len(matches)}.")
          distribution_id = matches[0]["Id"]

          if not re.fullmatch(r"[A-Z0-9]{1,32}", distribution_id):
              sys.exit("The discovered CloudFront distribution ID is invalid.")

          distribution = aws_json("get-distribution", "--id", distribution_id)["Distribution"]
          expected_origin = f'{os.environ["PORTFOLIO_BUCKET"]}.s3.{os.environ["AWS_REGION"]}.amazonaws.com'
          origins = distribution["DistributionConfig"]["Origins"]["Items"]

          if not any(origin["DomainName"] == expected_origin for origin in origins):
              sys.exit("The matched CloudFront distribution does not use the configured portfolio bucket as an origin.")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"distribution_id={distribution_id}\n")

          print("Found one authorised portfolio distribution with the configured S3 origin.")

          PY

      - name: Upload portfolio HTML to S3
        env:
          BUCKET: ${{ vars.PORTFOLIO_BUCKET }}
          SITE_DIRECTORY: ${{ runner.temp }}/portfolio-site
          MANIFEST_PATH: ${{ runner.temp }}/portfolio-site-manifest
        run: |
          while IFS= read -r -d '' relative_path; do
            case "$relative_path" in
              *.html) content_type="text/html; charset=utf-8" ;;
              *.css) content_type="text/css; charset=utf-8" ;;
              *) echo "Unsupported generated portfolio file: $relative_path" >&2; exit 1 ;;
            esac
            aws s3api put-object \
              --bucket "$BUCKET" \
              --key "portfolio/$relative_path" \
              --body "$SITE_DIRECTORY/$relative_path" \
              --content-type "$content_type" \
              --cache-control "no-cache, no-store, must-revalidate" \
              --no-cli-pager
          done < "$MANIFEST_PATH"

      - name: Invalidate CloudFront cache
        env:
          DISTRIBUTION_ID: ${{ steps.distribution.outputs.distribution_id }}
        run: |
          invalidation_id=$(aws cloudfront create-invalidation \
              --distribution-id "$DISTRIBUTION_ID" \
              --paths '/*' \
              --query 'Invalidation.Id' \
              --output text \
              --no-cli-pager)
          aws cloudfront wait invalidation-completed \
              --distribution-id "$DISTRIBUTION_ID" \
              --id "$invalidation_id" \
              --no-cli-pager
